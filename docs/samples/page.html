<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sample page</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 40px; color: #1f2933; }
  h1 { color: #2563eb; border-bottom: 2px solid #93c5fd; padding-bottom: 6px; }
  .card { background: #f1f5f9; border-left: 4px solid #22c55e; padding: 12px 16px; border-radius: 6px; }
  table { border-collapse: collapse; margin-top: 16px; }
  td, th { border: 1px solid #cbd5e1; padding: 6px 12px; }
  th { background: #e2e8f0; }
</style>
<script>document.write("<p>scripts ran (they shouldn't)</p>");</script>
</head>
<body>
  <h1>Sample page</h1>
  <p class="card">A styled card: CSS applies, and the script above doesn't run.</p>
  <table>
    <tr><th>Viewer</th><th>Drawn by</th></tr>
    <tr><td>HTML</td><td>a headless browser</td></tr>
    <tr><td>Word, RTF, ODT</td><td>LibreOffice</td></tr>
  </table>
</body>
</html>
